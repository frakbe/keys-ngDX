name: Android app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug > build-output.txt 2>&1
          result=$?
          cat build-output.txt
          if [ "$result" -ne 0 ]; then
            summary=$(grep -E '(^e: |^> |error:|FAILURE:)' build-output.txt | head -n 3 | tr '\n' ' ' | sed 's/[^A-Za-z0-9._:-]/_/g' | cut -c1-180)
            echo "summary=${summary:-gradle-failed}" >> "$GITHUB_OUTPUT"
          fi
          exit "$result"

      - name: Upload build diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-${{ steps.build.outputs.summary }}
          path: build-output.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keys-ngdx-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
